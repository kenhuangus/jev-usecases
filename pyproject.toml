[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-usecases"
version = "1.0.0"
description = "Production-ready TypeSafe Jev use-case implementations with confidence-gated harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ken Huang" }]
dependencies = [
  "typesafe-sdk>=0.1.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "click>=8.1",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
jev-usecases = "jev_usecases.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_usecases"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits the live TypeSafe API (requires TYPESAFE_API_KEY)",
]

[tool.hatch.build.targets.sdist]
include = ["src/jev_usecases", "fixtures", "README.md", ".env.example"]
