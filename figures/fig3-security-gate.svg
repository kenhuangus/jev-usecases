<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" width="500" height="470" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="500" height="470" fill="#FFFFFF"/>

  <g filter="url(#shadow)">
    <rect x="130" y="12" width="240" height="52" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  </g>
  <text x="250" y="34" font-size="10" font-weight="700" fill="#9A3412" text-anchor="middle">Prompt or brief</text>
  <text x="250" y="50" font-size="8.5" fill="#1F2937" text-anchor="middle">User text or LLM draft</text>

  <line x1="250" y1="68" x2="250" y2="88" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="130" y="92" width="240" height="52" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="250" y="114" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="middle">Jev screens input</text>
  <text x="250" y="130" font-size="8.5" fill="#1F2937" text-anchor="middle">Block, review, or allow</text>

  <line x1="180" y1="144" x2="110" y2="176" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="320" y1="144" x2="390" y2="176" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="180" width="188" height="52" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="110" y="202" font-size="10" font-weight="700" fill="#7F1D1D" text-anchor="middle">Stop</text>
  <text x="110" y="218" font-size="8.5" fill="#1F2937" text-anchor="middle">LLM is not called</text>

  <g filter="url(#shadow)">
    <rect x="296" y="180" width="188" height="52" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  </g>
  <text x="390" y="202" font-size="10" font-weight="700" fill="#14532D" text-anchor="middle">LLM drafts</text>
  <text x="390" y="218" font-size="8.5" fill="#1F2937" text-anchor="middle">Claude, else OpenAI</text>

  <line x1="390" y1="236" x2="390" y2="256" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="296" y="260" width="188" height="52" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="390" y="282" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="middle">Jev screens draft</text>
  <text x="390" y="298" font-size="8.5" fill="#1F2937" text-anchor="middle">Keep or discard text</text>

  <line x1="340" y1="312" x2="200" y2="348" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="390" y1="316" x2="390" y2="348" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="352" width="188" height="52" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="110" y="374" font-size="10" font-weight="700" fill="#7F1D1D" text-anchor="middle">Discard draft</text>
  <text x="110" y="390" font-size="8.5" fill="#1F2937" text-anchor="middle">Playbook decision stands</text>

  <g filter="url(#shadow)">
    <rect x="296" y="352" width="188" height="52" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  </g>
  <text x="390" y="374" font-size="10" font-weight="700" fill="#14532D" text-anchor="middle">Return draft</text>
  <text x="390" y="390" font-size="8.5" fill="#1F2937" text-anchor="middle">Caller still executes</text>
</svg>
