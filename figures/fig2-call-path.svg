<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="500" height="520" fill="#FFFFFF"/>

  <g filter="url(#shadow)">
    <rect x="40" y="12" width="420" height="72" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  </g>
  <text x="250" y="38" font-size="10" font-weight="700" fill="#9A3412" text-anchor="middle">1. State</text>
  <text x="250" y="58" font-size="8.5" fill="#1F2937" text-anchor="middle">Text or JSON the program already holds</text>
  <text x="250" y="74" font-size="8.5" fill="#1F2937" text-anchor="middle">No images. Filter fields before the call</text>
  <line x1="250" y1="88" x2="250" y2="108" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="112" width="420" height="72" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="250" y="138" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="middle">2. Questions</text>
  <text x="250" y="158" font-size="8.5" fill="#1F2937" text-anchor="middle">Choice, Score, and Noul in one request</text>
  <text x="250" y="174" font-size="8.5" fill="#1F2937" text-anchor="middle">Each question asks one narrow judgment</text>
  <line x1="250" y1="188" x2="250" y2="208" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="212" width="420" height="72" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  </g>
  <text x="250" y="238" font-size="10" font-weight="700" fill="#14532D" text-anchor="middle">3. Jev answers</text>
  <text x="250" y="258" font-size="8.5" fill="#1F2937" text-anchor="middle">Parallel probabilities and confidence</text>
  <text x="250" y="274" font-size="8.5" fill="#1F2937" text-anchor="middle">No generated prose and no type errors</text>
  <line x1="250" y1="288" x2="250" y2="308" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="312" width="420" height="72" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="250" y="338" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">4. Code</text>
  <text x="250" y="358" font-size="8.5" fill="#1F2937" text-anchor="middle">Thresholds, playbooks, and exact checks</text>
  <text x="250" y="374" font-size="8.5" fill="#1F2937" text-anchor="middle">Arithmetic, dates, and side effects stay here</text>
  <line x1="250" y1="388" x2="250" y2="408" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="412" width="420" height="72" rx="10" fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
  </g>
  <text x="250" y="438" font-size="10" font-weight="700" fill="#581C87" text-anchor="middle">5. UseCaseResult</text>
  <text x="250" y="458" font-size="8.5" fill="#1F2937" text-anchor="middle">decision, action_band, actions</text>
  <text x="250" y="474" font-size="8.5" fill="#1F2937" text-anchor="middle">Caller acts. Jev does not execute tools</text>
</svg>
